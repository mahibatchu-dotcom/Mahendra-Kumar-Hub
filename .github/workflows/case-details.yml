name: Case competition details

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Set by the hub website"
        required: false
      cases:
        description: "Set by the hub website (competitions to look up)"
        required: false

concurrency:
  group: case-details
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Look up competitions online
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          CASES: ${{ github.event.inputs.cases }}
        run: python case_details.py

      - name: Save results
        run: |
          git config user.name "dot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add casecomps || true
          if ! git diff --cached --quiet; then
            git commit -m "Case competition details"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
